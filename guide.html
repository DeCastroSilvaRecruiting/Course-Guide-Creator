<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Course Guide Booklet</title>
    <meta name="description" content="A printable, hole-by-hole yardage booklet: tee-to-hazard and tee-to-green distances, plus a green detail card with length, width and slope." />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#173d2b" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="shell">

      <div class="card no-print">
        <div class="hero" style="padding:20px 30px;">
          <div class="kicker">Course Guide Creator</div>
          <h1 style="font-size:22px;" id="guide-course-name">Course guide booklet</h1>
        </div>
        <div class="content" style="padding:16px 30px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
          <a class="btn secondary" id="guide-back-link" href="index.html">&larr; Back to course</a>
          <button class="btn" id="guide-print" type="button">Print / Save as PDF</button>
        </div>
      </div>

      <div class="booklet" id="guide-holes"></div>

    </div>

    <script src="js/config.js"></
      <script src="js/storage.js"></
        <script src="js/guide.js"></
  </body>
        </html>
